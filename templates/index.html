<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call Center System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>

    <!-- barra de navegacion -->
    <div class="navbar">
        <button id="menuBtn">☰</button>

        <h2> Call Center System</h2>

        <div class="menu">
            <a href="#Dashboard">Dashboard</a>
            <a href="#Registrar">Registrar</a>
            <a href="#Solicitudes">Solicitudes</a>
        </div>
    </div>

    <div class="container">
        <div class="sidebar">
            <h3>Menú</h3>
            <a href="#Dashboard">Dashboard</a>
            <a href="#Registrar">Registrar Cliente</a>
            <a href="#Solicitudes">Solicitudes</a>
        </div>

        <main class="main">

            <!-- DASHBOARD -->
            <section class="Dashboard" id="Dashboard">
                <h2>Dashboard</h2>
                <hr><br>

                <div class="cards">
                    <div class="card">
                        <h3 id="total">0</h3>
                        <p>Total</p>
                    </div>

                    <div class="card">
                        <h3 id="pendientes">0</h3>
                        <p>Pendientes</p>
                    </div>

                    <div class="card">
                        <h3 id="proceso">0</h3>
                        <p>En Proceso</p>
                    </div>

                    <div class="card">
                        <h3 id="resueltos">0</h3>
                        <p>Resueltos</p>
                    </div>
                </div>

                <div class="grafica">
                    <h3>Estadísticas</h3>
                    <canvas id="miGrafica"></canvas>
                </div>
            </section>


            <!-- FORMULARIO -->
            <section class="form" id="Registrar">
                <div class="ini">
                    <h3>Registrar Cliente</h3>
                    <hr><br>

                    <input type="text" id="nombre" placeholder="Nombre">
                    <input type="text" id="telefono" placeholder="Teléfono">

                    <select id="tipo">
                        <option value="">Tipo</option>
                        <option>Cita médica</option>
                        <option>Taxes</option>
                        <option>Asesoría</option>
                    </select>

                    <select id="estado">
                        <option value="">Estado</option>
                        <option>Pendiente</option>
                        <option>En proceso</option>
                        <option>Resuelto</option>
                    </select>

                    <select id="linea">
                        <option value="">Línea WhatsApp</option>
                        <option>Línea 1</option>
                        <option>Línea 2</option>
                        <option>Línea 3</option>
                        <option>Línea 4</option>
                        <option>Línea 5</option>
                        <option>Línea 6</option>
                    </select>

                    <select id="jefe">
                        <option value="">Cartera / Jefe</option>
                        <option>Jefe 1</option>
                        <option>Jefe 2</option>
                        <option>Jefe 3</option>
                    </select>

                    <button onclick="guardarCliente()">Guardar</button>
                </div>
            </section>


            <!-- Tabla -->
            <section class="clientes" id="Solicitudes">
                <h2>Solicitudes</h2>
                <hr><br>

                <table>
                    <thead>
                        <tr>
                            <th>Cliente</th>
                            <th>Teléfono</th>
                            <th>Tipo</th>
                            <th>Estado</th>
                            <th>Línea</th>
                            <th>Jefe</th>
                            <th>Inicio</th>
                            <th>Fin</th>
                            <th>Acción</th>
                        </tr>
                    </thead>

                    <tbody id="tablaClientes">
                        <!-- informacion de los clientes - script.js -  -->
                    </tbody>
                </table>
            </section>

        </main>
    </div>

    <footer style="text-align: center;">
        <p>&copy; 2026 Call center</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
